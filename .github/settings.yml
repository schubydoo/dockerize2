# Probot Settings (https://github.com/repository-settings/app)
# Install the GitHub App on this repo to make settings declarative.
# Note: the App requires `Administration: Read & write` permission on the repo
# to apply branch protection rules.

repository:
  name: dockerize2
  description: >-
    Pack a dynamically linked ELF binary and its dependencies into a minimal
    scratch Docker image. Successor fork of larsks/dockerize.
  topics: >-
    docker,elf,ldd,binary,container,image,scratch,minimal,oci,upx,sbom
  homepage: https://github.com/schubydoo/dockerize2
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: true
  default_branch: master
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  allow_auto_merge: true
  delete_branch_on_merge: true

branches:
  - name: master
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks:
        # Context names must match the check-run names GitHub records
        # exactly — that's the job's `name:` field, not "workflow / job".
        # The check must also have run on the repo at least once before
        # it can be marked required. These four have, per
        # `gh api repos/.../commits/master/check-runs`.
        strict: true
        contexts:
          - "ruff + mypy"
          - "analyze (python)"
          - "secret scan"
          - "filesystem scan"
      # `null` (not `false`) — the Probot Settings App rejects `false` here
      # silently. See repository-settings/app#923 (comment 2200600178).
      enforce_admins: null
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
      required_conversation_resolution: true
      # Same `null`-vs-empty-array gotcha; explicit `null` for safety.
      restrictions: null
