name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------
  # Plan — determines which optional jobs run and what matrix shape to
  # use. Outputs are consumed by every other job in this workflow via
  # `needs: plan`.
  #
  # On push / schedule / workflow_dispatch: run everything, full 3x3
  # matrix. The master branch is the single source of "we definitely
  # built and tested on every supported platform."
  #
  # On pull_request: detect what changed; default to a single
  # ubuntu-latest x 3.13 matrix cell (cheap, fast, catches >95% of
  # regressions); skip tests/integration/slim-smoke entirely if no
  # Python code moved (docs-only / workflow-only PRs).
  #
  # PR labels:
  #   test:full  - force the full 3x3 matrix on this PR
  #   test:skip  - skip tests + integration + slim-smoke entirely
  #                (e.g. CI plumbing PR that doesn't change the test surface)
  # --------------------------------------------------------------------
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      python_changed: ${{ steps.plan.outputs.python_changed }}
      run_tests: ${{ steps.plan.outputs.run_tests }}
      run_integration: ${{ steps.plan.outputs.run_integration }}
      matrix_os: ${{ steps.plan.outputs.matrix_os }}
      matrix_python: ${{ steps.plan.outputs.matrix_python }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          # Defaults: non-PR events (push / schedule / dispatch) run the
          # full suite on the full matrix. The master push run is the
          # canonical "full platform coverage" gate.
          python_changed=true
          run_tests=true
          run_integration=true
          matrix_os='["ubuntu-latest","macos-latest","windows-latest"]'
          matrix_python='["3.11","3.12","3.13"]'

          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "${BASE_REF}" --depth=50
            files=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            echo "Changed files:"
            printf '%s\n' "$files"

            # Detect Python-relevant changes (the only kind that affects
            # tests/integration/slim-smoke coverage).
            python_changed=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                dockerize/*|tests/*|pyproject.toml|uv.lock|Dockerfile) python_changed=true ;;
              esac
            done <<< "$files"

            # PR labels.
            has_full=false
            has_skip=false
            if echo "$LABELS" | grep -q '"test:full"'; then has_full=true; fi
            if echo "$LABELS" | grep -q '"test:skip"'; then has_skip=true; fi

            # Trim PR matrix to a single cell unless test:full opts in.
            if [ "$has_full" = false ]; then
              matrix_os='["ubuntu-latest"]'
              matrix_python='["3.13"]'
            fi

            # Skip optional jobs when nothing relevant changed, or when
            # the maintainer opts out explicitly.
            if [ "$has_skip" = true ] || [ "$python_changed" = false ]; then
              run_tests=false
              run_integration=false
            fi
          fi

          {
            echo "python_changed=$python_changed"
            echo "run_tests=$run_tests"
            echo "run_integration=$run_integration"
            echo "matrix_os=$matrix_os"
            echo "matrix_python=$matrix_python"
          } >> "$GITHUB_OUTPUT"

          echo "==== Plan ===="
          echo "  event:           $EVENT"
          echo "  python_changed:  $python_changed"
          echo "  run_tests:       $run_tests"
          echo "  run_integration: $run_integration"
          echo "  matrix_os:       $matrix_os"
          echo "  matrix_python:   $matrix_python"

  # --------------------------------------------------------------------
  # Unit tests across the configured matrix. Matrix dimensions come from
  # the plan job — PRs default to 1 cell, master push runs 3x3.
  # --------------------------------------------------------------------
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: plan
    if: needs.plan.outputs.run_tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.matrix_os) }}
        python-version: ${{ fromJSON(needs.plan.outputs.matrix_python) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      # Matrix values flow through an env var (rather than being inlined
      # directly as `${{ matrix.python-version }}`) so zizmor's template-
      # injection static analysis doesn't flag the `run:` blocks. The
      # matrix is hard-coded in the `plan` job (only ever one of two
      # arrays) and not derived from any PR-controllable source, so this
      # is purely a static-analysis appeasement — no real security delta.
      # `shell: bash` keeps the `"$PYTHON_VERSION"` syntax cross-platform
      # (Windows runners default to pwsh otherwise).
      - name: Set up Python ${{ matrix.python-version }}
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"
      - name: Install
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv sync --extra dev --python "$PYTHON_VERSION"
      - name: Run tests
        # --cov-fail-under is set conservatively to catch regressions, not to
        # encode the current ceiling. Raise it as coverage improves.
        # Actual on the lowest-coverage platform (Windows, which skips the
        # symlink + integration tests) is ~83%; floor sits a few points below.
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv run --python "$PYTHON_VERSION" pytest -q --cov=dockerize --cov-report=term-missing --cov-fail-under=80

  # --------------------------------------------------------------------
  # Integration — exercises the real syft + upx + docker pipeline.
  # Gates on `run_integration` (auto-skipped on docs-only PRs).
  # --------------------------------------------------------------------
  integration:
    name: integration (ubuntu)
    needs: [plan, tests]
    if: needs.plan.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Kept in sync with the Dockerfile's SYFT_VERSION ARG. Renovate
      # tracks both via the custom regex manager in renovate.json.
      SYFT_VERSION: v1.45.1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install upx
        # Debian/Ubuntu ship upx-ucl in main; close enough to upstream
        # for an integration smoke test.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends upx-ucl
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - name: Install syft
        # Build syft from the pinned module version, mirroring the Dockerfile's
        # syft-builder stage. Avoids piping a remote install script to sh, which
        # Scorecard's Pinned-Dependencies check flags as an unpinned dependency.
        run: |
          set -euo pipefail
          go install -trimpath -ldflags="-s -w -X main.version=${SYFT_VERSION}" \
            "github.com/anchore/syft/cmd/syft@${SYFT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/syft" version
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install
        run: uv sync --extra dev --python 3.13
      - name: Integration tests
        run: uv run pytest -q --run-integration -k integration

  # --------------------------------------------------------------------
  # Slim image smoke — builds `target: slim`, exercises the daemonless
  # --output-oci path inside the container, and asserts size stays under
  # 60 MB compressed. Gates on `python_changed` since the slim image is
  # entirely Python + base; only Python/Dockerfile/deps changes can
  # affect it. Always runs on push so the master baseline tracks.
  # --------------------------------------------------------------------
  slim-smoke:
    name: slim image smoke
    needs: [plan, tests]
    if: needs.plan.outputs.python_changed == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build :slim (amd64, load)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: slim
          platforms: linux/amd64
          load: true
          tags: dockerize2:slim-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Functional smoke — --output-oci runs daemonless
        # /bin/ls is part of the slim image's debian-slim base; trace runs
        # inside the container. No docker socket mounted — proves that the
        # `:slim` variant delivers on its daemonless promise.
        run: |
          set -euo pipefail
          mkdir -p oci-out
          docker run --rm \
            -v "$PWD/oci-out:/out" \
            dockerize2:slim-smoke \
            --output-oci /out/ls.oci.tar /bin/ls
          test -s oci-out/ls.oci.tar
          tar -tf oci-out/ls.oci.tar | grep -q '^oci-layout$'
          tar -tf oci-out/ls.oci.tar | grep -q '^index.json$'
          echo "OCI archive valid ($(stat -c%s oci-out/ls.oci.tar) bytes)"
      - name: Size guard — slim must stay slim (< 60 MB compressed)
        # `docker save | gzip` overshoots registry-compressed size somewhat
        # but it's the closest proxy available in a CI step without pushing.
        run: |
          set -euo pipefail
          bytes=$(docker save dockerize2:slim-smoke | gzip -c | wc -c)
          mb=$((bytes / 1024 / 1024))
          echo "Slim image (docker save | gzip): ${mb} MB (${bytes} bytes)"
          if [ "$mb" -gt 60 ]; then
            echo "::error::Slim image exceeded 60 MB threshold: ${mb} MB"
            exit 1
          fi

  # --------------------------------------------------------------------
  # Full image smoke — sibling of slim-smoke for the `:latest` variant.
  # Target-less build = the LAST stage in the Dockerfile (`full`), which
  # is what release.yml publishes as `:latest`. release.yml builds this
  # multi-arch on tag push, but PRs touching Dockerfile previously had
  # no signal for the `:full` stage either. This job closes the same
  # gap that slim-smoke closes for `:slim`.
  #
  # Validates three things on every PR (gated on python_changed):
  #   1. The target-less Dockerfile stage actually builds. Catches
  #      stage-4b breakage (the docker CLI / upx / syft install layer).
  #   2. The bundled tools (docker CLI, syft, upx) are present and
  #      report a version. Catches stale ARGs / broken extract steps.
  #   3. Compressed image stays under 120 MB. v0.5.0 :latest ships at
  #      ~93 MB compressed; threshold leaves headroom for normal base
  #      / deps bumps but catches accidental ~25 MB additions.
  # amd64 only; multi-arch coverage stays with the release pipeline.
  # --------------------------------------------------------------------
  full-smoke:
    name: full image smoke
    needs: [plan, tests]
    if: needs.plan.outputs.python_changed == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build :latest (amd64, load)
        # Target-less build = the `full` stage (LAST in the Dockerfile).
        # Same artefact as the release.yml `:latest` build, single-arch.
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dockerize2:full-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Functional smoke — bundled tools report versions
        # The full image bundles docker CLI + syft + upx on top of the
        # slim base. `--version` calls don't need a docker daemon
        # (client-side only) so no socket mount is required.
        run: |
          set -euo pipefail
          docker run --rm dockerize2:full-smoke --help | head -5
          docker run --rm --entrypoint /usr/local/bin/docker dockerize2:full-smoke --version
          docker run --rm --entrypoint /usr/local/bin/syft dockerize2:full-smoke version
          docker run --rm --entrypoint /usr/local/bin/upx dockerize2:full-smoke --version | head -1
      - name: Size guard — full image must stay reasonable (< 120 MB compressed)
        # v0.5.0 :latest ships at ~93 MB compressed on GHCR. 120 MB
        # leaves comfortable headroom for normal base/deps bumps but
        # catches accidental ~25 MB additions (e.g. a stranded apt
        # layer, an unintended package install).
        run: |
          set -euo pipefail
          bytes=$(docker save dockerize2:full-smoke | gzip -c | wc -c)
          mb=$((bytes / 1024 / 1024))
          echo "Full image (docker save | gzip): ${mb} MB (${bytes} bytes)"
          if [ "$mb" -gt 120 ]; then
            echo "::error::Full image exceeded 120 MB threshold: ${mb} MB"
            exit 1
          fi

  # --------------------------------------------------------------------
  # Required-checks aggregator. ONE check for branch protection to gate
  # on, regardless of how many jobs exist. `if: always()` so it runs
  # even when needs failed; jq pattern fails the aggregator iff any
  # listed job is not success-or-skipped (i.e. failed, cancelled, etc).
  #
  # Same pattern as uv/ruff. Add new required jobs by appending to
  # `needs:`; nothing else to change.
  # --------------------------------------------------------------------
  ci-required-checks-passed:
    name: ci required checks passed
    if: always()
    needs:
      - plan
      - tests
      - integration
      - slim-smoke
      - full-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')
          if [ -n "$failing" ]; then
            echo "Failed or cancelled jobs:"
            echo "$failing"
            exit 1
          fi
          echo "All required jobs passed (or were intentionally skipped)."
