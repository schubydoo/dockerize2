name: Security

# Consolidates the previous four security-scan workflows into one file so the
# project's security posture is grokkable at a glance. Each scanner remains a
# distinct JOB (not a step) so they run in parallel and still appear as
# individually identifiable rows in the PR checks list and the code-scanning
# Security tab — this is FILE consolidation, not job collapse.
#
# Replaces:
#   - .github/workflows/codeql.yml    (Mon 03:23 UTC)
#   - .github/workflows/gitleaks.yml  (Mon 06:44 UTC)
#   - .github/workflows/trivy.yml     (Mon 05:12 UTC)
#   - .github/workflows/zizmor.yml    (Mon 04:37 UTC)
# Plus adds a new `dependency-review` job that fails PRs which introduce
# transitive deps with known vulnerabilities at HIGH+ severity (complement to
# trivy-fs, which scans the dep set we already have).
#
# Schedules collapsed to a single Monday 04:37 UTC slot (formerly zizmor's).
# All scans fire together weekly; total wall time is ~5 min summed, not worth
# spreading across four cron slots.
#
# Code-scanning alert continuity note: the analysis key for code-scanning
# alerts includes the workflow path, so renaming `trivy.yml` → `security.yml`
# resets the link between the existing open Trivy alerts and the new scans.
# Those alerts will re-appear under the new path on the next run with the
# same CVE info. For dockerize2 the baseline is 7 open alerts (all
# upstream-gated CVEs we can't action), so the reset is a non-event.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "37 4 * * 1"
  # After a Release finishes, re-scan the freshly published :latest. The
  # push-to-master scan races the tag-triggered Release build and reads the
  # PREVIOUS :latest, so post-release the image alerts lag by one scan cycle
  # (until the Monday cron). workflow_run waits for the whole Release workflow
  # — including the image push — to complete, so :latest is guaranteed current.
  # Only the trivy-image job acts on this event (every other job gates it out),
  # which keeps the code-scanning analysis key identical and refreshes the
  # existing image alerts in place instead of creating a duplicate set.
  # zizmor: ignore[dangerous-triggers] — safe here: this job neither checks
  # out the triggering run's (untrusted) code nor consumes its artifacts; it
  # only pulls the already-published GHCR :latest and uploads SARIF pinned to
  # master. No privilege is handed to attacker-controlled content.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  # event_name in the key so a post-release (workflow_run) scan can't be
  # cancelled by — or cancel — a concurrent push scan on refs/heads/master.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------
  # Changes detection — runs once at the top of every PR run. Outputs
  # boolean flags for the path-gated jobs below (trivy-fs, trivy-image,
  # zizmor). Always-run scanners (codeql, gitleaks, dependency-review)
  # ignore these outputs.
  #
  # On non-PR events (push, schedule, workflow_dispatch) the diff step is
  # skipped and outputs are empty; gated jobs fall through to their
  # `|| github.event_name != 'pull_request'` clause and run unconditionally.
  # The job itself still runs (no steps fail) so `needs: changes` is
  # satisfied for dependents.
  # --------------------------------------------------------------------
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      deps: ${{ steps.diff.outputs.deps }}
      image: ${{ steps.diff.outputs.image }}
      workflows: ${{ steps.diff.outputs.workflows }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Diff against base
        id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}" --depth=50
          files=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "Changed files:"
          printf '%s\n' "$files"
          deps=false
          image=false
          workflows=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              pyproject.toml|uv.lock)       deps=true; image=true ;;
              Dockerfile)                    image=true ;;
              .github/workflows/*.yml|.github/workflows/*.yaml) workflows=true ;;
            esac
          done <<< "$files"
          {
            echo "deps=$deps"
            echo "image=$image"
            echo "workflows=$workflows"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved flags: deps=$deps image=$image workflows=$workflows"

  # --------------------------------------------------------------------
  # CodeQL — semantic source analysis. Always runs on PRs because
  # security-relevant code patterns can be introduced anywhere.
  # (Was: codeql.yml)
  # --------------------------------------------------------------------
  codeql:
    name: codeql analyze
    # Source analysis — irrelevant to a post-release image re-scan.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:${{ matrix.language }}"

  # --------------------------------------------------------------------
  # Gitleaks — secret scanning. Always runs on every PR; secrets can land
  # anywhere (docs, examples, fixture files). (Was: gitleaks.yml)
  # --------------------------------------------------------------------
  gitleaks:
    name: secret scan
    # Secret scan over the source — irrelevant to a post-release image re-scan.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------
  # Trivy filesystem scan — gates on FIXABLE CVEs in our declared deps.
  # `ignore-unfixed: true` means we only fail when an upstream fix exists.
  # (Was: trivy.yml / fs)
  # --------------------------------------------------------------------
  trivy-fs:
    name: trivy filesystem scan
    needs: changes
    # Gates on changes to pyproject.toml / uv.lock — fs scan reads the
    # dep manifest; nothing else moves the result. Always runs on push /
    # schedule so the master-tracked baseline stays current.
    if: (needs.changes.outputs.deps == 'true' || github.event_name != 'pull_request') && github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Trivy fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          # Gate on fixable findings in our own dependencies. ignore-unfixed
          # means only CVEs with an available fix fail the job.
          exit-code: "1"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # --------------------------------------------------------------------
  # Trivy image scan — report-only for runtime-image CVEs in third-party
  # binaries (docker CLI, syft) whose patches we usually can't action.
  # On PR: builds the PR's Dockerfile (amd64, --load) and scans THAT.
  # On push/cron/workflow_run: scans the published :latest from GHCR.
  # Single image-scan job for every event keeps the analysis key stable
  # across PR and master (alerts otherwise show "cannot determine alerts
  # introduced by this PR"). This is also the ONLY job that runs on the
  # post-release workflow_run event. (Was: trivy.yml / image)
  # --------------------------------------------------------------------
  trivy-image:
    name: trivy image scan
    needs: changes
    # Gates on Dockerfile or dep changes — those are the only PR-side
    # diffs that can change the built image's CVE surface. Always runs on
    # push / schedule (scans :latest from GHCR; catches drift even when
    # the Dockerfile is untouched). On workflow_run, runs only if the
    # Release it followed actually succeeded (else :latest is unchanged).
    if: >-
      (needs.changes.outputs.image == 'true' || github.event_name != 'pull_request')
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build PR image (load to runner)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dockerize2:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve image ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "ref=dockerize2:scan" >> "$GITHUB_OUTPUT"
          else
            echo "ref=ghcr.io/${OWNER}/dockerize2:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Trivy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.ref }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
          # On workflow_run the event ref is the Release's *tag*; the codeql
          # action would otherwise file these alerts against the tag ref. Pin
          # to master (the tagged commit is master's tip at release time) so
          # the image alerts refresh on the branch the Security tab tracks.
          # Empty on every other event → the action auto-detects ref/sha.
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/master' || '' }}
          sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

  # --------------------------------------------------------------------
  # Zizmor — audits the workflow files themselves for misconfigurations
  # (unpinned actions, dangerous triggers, token leaks, etc).
  # (Was: zizmor.yml)
  # --------------------------------------------------------------------
  zizmor:
    name: workflow audit
    needs: changes
    # Gates on workflow file changes — zizmor exclusively audits workflows.
    # Always runs on push / schedule so a new zizmor rule release still
    # has a chance to flag pre-existing issues.
    if: (needs.changes.outputs.workflows == 'true' || github.event_name != 'pull_request') && github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install zizmor
        run: uv tool install zizmor
      - name: Run zizmor
        run: zizmor --format sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
          category: zizmor

  # --------------------------------------------------------------------
  # Dependency review (NEW) — GitHub-first-party action that diffs the
  # PR's dependency manifest against base and fails on newly-introduced
  # vulnerable transitive deps. Complements trivy-fs (which scans the
  # already-present manifest); this catches CVEs *at the merge boundary*
  # before they land on master. PR events only — no base to diff against
  # on push.
  # --------------------------------------------------------------------
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write  # to post the on-failure summary comment
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # --------------------------------------------------------------------
  # Required-checks aggregator (security side). Mirrors the pattern in
  # ci.yml's `ci-required-checks-passed`. Branch protection requires
  # only this one check from this workflow (plus the ci aggregator and
  # `conventional PR title`); the per-scanner check names are not
  # individually required, so renaming a scanner or adding a new one
  # doesn't silently break protection.
  #
  # GitHub Actions doesn't support cross-workflow `needs:`, which is why
  # security and ci each carry their own aggregator. Two required checks
  # in branch protection instead of one — acceptable tradeoff for
  # keeping security in its own file.
  # --------------------------------------------------------------------
  security-required-checks-passed:
    name: security required checks passed
    if: always()
    needs:
      - changes
      - codeql
      - gitleaks
      - trivy-fs
      - trivy-image
      - zizmor
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')
          if [ -n "$failing" ]; then
            echo "Failed or cancelled jobs:"
            echo "$failing"
            exit 1
          fi
          echo "All required jobs passed (or were intentionally skipped)."
