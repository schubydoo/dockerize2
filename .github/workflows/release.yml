name: Release

on:
  push:
    tags:
      - "v*"
  # Manual fallback to (re)publish an existing tag — e.g. to recover a release
  # whose tag was pushed by GITHUB_TOKEN and therefore didn't trigger the
  # push-tags run. Dispatch from the default branch and pass the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.3.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Releases must NOT be cancelled mid-flight — a partially-pushed multi-arch
  # image or a half-uploaded PyPI publish is harder to recover from than just
  # letting two release runs serialise.
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  pypi:
    name: PyPI publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `pypi` environment gates this job: deployments are restricted to
    # `v*` tags and require a maintainer's manual approval before the publish
    # runs. PyPI Trusted Publishing (OIDC) is configured for this repo +
    # workflow + environment, so no API token is needed.
    environment:
      name: pypi
      url: https://pypi.org/p/dockerize2
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Disable cache for release builds so a poisoned cache from CI
          # can't influence the published artefact.
          enable-cache: false
      - name: Build
        run: uv build
      - name: Upload dist artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # No repository-url override: defaults to the real PyPI
          # (https://upload.pypi.org/legacy/).
          # Tolerate the case where this same version was already uploaded
          # by an earlier (possibly partial-failure) workflow run, so we can
          # re-trigger the release after fixing a downstream job without
          # the publish step refusing the duplicate.
          skip-existing: true

  image:
    name: GHCR image (multi-arch + cosign + SBOM)
    runs-on: ubuntu-latest
    # Multi-arch (amd64 + arm64 + armv7) under QEMU emulation plus syft
    # cross-compile + cosign sign of both `:latest` and `:slim` tags. v0.5.0
    # ran in 5m20s on a warm cache; cold cache can push toward 30 min.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        # Annotate at both per-arch (manifest) AND manifest-list (index)
        # levels. GHCR's package UI reads the description from the
        # manifest-list-level annotation; without `index` here the
        # package page shows "No description provided."
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Pass `value=` explicitly so the semver tags resolve whether the
          # run was triggered by a tag push (github.ref_name) or a manual
          # workflow_dispatch (inputs.tag); the latter runs on a branch ref
          # from which metadata-action couldn't otherwise infer a version.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Slim image metadata
        id: meta-slim
        # `:slim` is the minimal (pure-Python) variant: base + dockerize2, no
        # docker CLI / syft / upx. suffix=-slim on the versioned tags; a plain
        # `:slim` moving tag (suffix override) replaces `:latest` for this
        # variant (latest=false so we don't also publish `:latest`).
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=-slim
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=slim,suffix=
            type=sha,prefix=sha-,format=short

      - name: Build and push (slim)
        id: build-slim
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: slim
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          annotations: ${{ steps.meta-slim.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Sign slim image (keyless)
        env:
          DIGEST: ${{ steps.build-slim.outputs.digest }}
          TAGS: ${{ steps.meta-slim.outputs.tags }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  github-release:
    name: GitHub Release
    needs: [pypi, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Download dist artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Extract changelog section
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v ver="$version" '
            /^## / {
              if (found) exit
              if ($0 ~ "\\["ver"\\]") { found = 1; next }
            }
            found
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG section found for [${version}]"
            exit 1
          fi
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no dist artefacts to attach to the release"
            exit 1
          fi
          # Idempotent: if the release already exists (e.g. Release Please
          # created it, or this is a re-publish), refresh its notes and
          # artefacts instead of failing on a duplicate.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --notes-file release-notes.md
            gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${files[@]}"
          fi
