[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dockerize2"
dynamic = ["version"]
description = "Pack a dynamically linked ELF binary and its dependencies into a minimal scratch Docker image."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "Schuby", email = "schubydoo@users.noreply.github.com" },
]
maintainers = [
    { name = "Schuby", email = "schubydoo@users.noreply.github.com" },
]
keywords = ["docker", "elf", "ldd", "binary", "container", "image", "minimal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "jinja2>=3.1",
    "pyelftools>=0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.10",
    "pre-commit>=4.0",
]

[project.scripts]
dockerize = "dockerize.main:main"

[project.urls]
Homepage = "https://github.com/schubydoo/dockerize2"
Repository = "https://github.com/schubydoo/dockerize2"
Issues = "https://github.com/schubydoo/dockerize2/issues"
Changelog = "https://github.com/schubydoo/dockerize2/blob/master/CHANGELOG.md"

[tool.hatch.version]
path = "dockerize/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "dockerize",
    "examples",
    "README.md",
    "LICENSE.txt",
    "NOTICE",
    "CHANGELOG.md",
    "SECURITY.md",
]

[tool.hatch.build.targets.wheel]
packages = ["dockerize"]
